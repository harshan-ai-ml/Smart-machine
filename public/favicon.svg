<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Magnifying glass circle -->
  <circle cx="90" cy="90" r="60" fill="none" stroke="#2D3E50" stroke-width="16"/>
  
  <!-- Magnifying glass handle -->
  <line x1="140" y1="140" x2="210" y2="210" stroke="#2D3E50" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Heartbeat/pulse line -->
  <line x1="30" y1="90" x2="60" y2="90" stroke="#1E90FF" stroke-width="6" stroke-linecap="round"/>
  <polyline points="60,90 70,70 80,110 90,90 100,90 110,70 120,110 130,90 160,90" fill="none" stroke="#1E90FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="160" y1="90" x2="190" y2="90" stroke="#1E90FF" stroke-width="6" stroke-linecap="round"/>
</svg>